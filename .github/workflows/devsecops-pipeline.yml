name: devsecops-ci-pipeline
on:
  push:
    branches:
      - main

jobs:
  ci-job:
    runs-on: ubuntu-latest
    steps:
      - name: Secret Scanning by GitLeaks
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    
      - name: Code Checkout or Code Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   
          
      - name: SonarQube Scanning
        uses: sonarsource/sonarcloud-github-action@v5.0.0 # Ex: v4.0.0, See the latest version at https://github.com/marketplace/actions/sonarcloud-scan
        env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=appseccoverity1
            -Dsonar.projectKey=appseccoverity1_sysfoo
            -Dsonar.sources=.
            -Dsonar.verbose=true
            -Dsonar.language=java

      - name: SCA Scanning with Snyk tool
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  
build-sysfoo:
  needs:
    - ci-job

  permissions:
    security-events: write

  runs-on: ubuntu-latest

  steps:
    - name: Code Checkout or Code Clone
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
          
    - name: Docker Builds
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sysfoo:v1 .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: '${{ secrets.DOCKER_USERNAME }}/sysfoo:v1'
        format: 'sarif'
        output: 'trivy-results.sarif'
          
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
        category: aqua-trivy  

    - name: Docker Hub login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker Push
      run: docker push ${{ secrets.DOCKER_USERNAME }}/sysfoo:v1


  Deploy-K8S:
   needs:
   - buid-sysfoo
   runs-on: ubuntu-latest
   
  steps:
      - name: Secret Scanning by GitLeaks
        uses: actions/checkout@v4
        
      - name: Start minikube
        uses: medyagh/setup-minikube@latest

      - name: Try the Cluster!
        run: kubectl get pods -A

      - name: Deploy to minikube
        run: |
         kubectl apply -f manifests/deployment.yaml
         kubectl apply -f manifests/service.yaml
         kubectl wait --for-condition=ready pod -l app=sysfoo

      - name: test Service url
        run: |
         minikube service list
         minikube service sysfoo-service --url
         echo "=====================Opening the service============================"
         curl $(minikube service sysfoo-service --url)
