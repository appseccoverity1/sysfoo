name: devsecops-ci-pipeline
on:
  push:
    branches:
      - main

jobs:
  ci-job:
    runs-on: ubuntu-latest
    steps:
      - name: Secret Scanning by GitLeaks
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    
      - name: Code Checkout or Code Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       

  build-sysfoo:
   needs:
   - ci-job
   runs-on: ubuntu-latest
   steps:
      - name: Code Checkout or Code Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  
          
      - name: Docker Builds
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sysfoo:v1 .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/sysfoo:v1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: aqua-trivy  

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/sysfoo:v1
