name: devsecops-ci-pipeline

on:
  push:
    branches:
      - main

jobs:

  ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning with GitLeaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Scanning
        uses: sonarsource/sonarcloud-github-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=appseccoverity1
            -Dsonar.projectKey=appseccoverity1_sysfoo
            -Dsonar.sources=.
            -Dsonar.verbose=true

      - name: SCA Scanning with Snyk
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  build-sysfoo:
    needs:
      - ci-job

    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sysfoo:v1 .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/sysfoo:v1
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: aqua-trivy

      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Push
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sysfoo:v1


  Deploy-K8S:
    needs:
      - build-sysfoo

    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Check Kubernetes Cluster
        run: |
          kubectl get pods -A

      - name: Deploy to Minikube
        run: |
          kubectl apply -f manifests/deployment.yaml
          kubectl apply -f manifests/service.yaml
          kubectl wait --for=condition=ready pod -l app=sysfoo

      - name: Test Service URL
        run: |
          minikube service list
          SERVICE_URL=$(minikube service sysfoo-service --url)
          echo "===================== Opening the service ====================="
          echo "Service URL: $SERVICE_URL"
          curl "$SERVICE_URL"
